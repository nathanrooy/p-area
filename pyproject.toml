[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parea"
dynamic = ["version"]
description = "The easiest way to calculate the projected/frontal area of an STL."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Nathan A. Rooy", email = "nathanrooy@gmail.com" },
]
keywords = [
    "aerodynamics",
    "cad",
    "cfd",
    "computational-geometry",
    "frontal-area",
    "projected-area",
    "stl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "shapely>=2.0",
]

[project.urls]
Homepage = "https://github.com/nathanrooy/p-area"
Repository = "https://github.com/nathanrooy/p-area"
Issues = "https://github.com/nathanrooy/p-area/issues"

[project.scripts]
parea = "parea:main"

[tool.setuptools.packages.find]
include = ["parea*"]

[tool.setuptools.package-data]
parea = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "parea.__about__.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "NPY", # NumPy-specific rules
    "RUF", # Ruff-specific rules
]

[tool.mypy]
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
